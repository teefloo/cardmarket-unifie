<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu immédiat et prix mini par état et langue</title>
  <desc id="desc">Des cartes Pokémon réelles illustrent les aperçus compacts et le prix mini selon l’état et la langue, directement dans une liste Wants Cardmarket.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102238"/>
      <stop offset="1" stop-color="#1B3C52"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2CD1C0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2CD1C0" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="170%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#061321" flood-opacity=".42"/>
    </filter>
    <clipPath id="small-card-clip" clipPathUnits="userSpaceOnUse"><rect width="83" height="117" rx="6"/></clipPath>
    <clipPath id="main-card-clip" clipPathUnits="userSpaceOnUse"><rect width="112" height="159" rx="8"/></clipPath>
  </defs>
  <rect width="440" height="280" rx="20" fill="url(#bg)"/>
  <circle cx="408" cy="42" r="126" fill="url(#glow)"/>
  <path d="M0 232C108 194 170 291 288 228s114-46 152-84v136H0z" fill="#2CD1C0" opacity=".055"/>
  <path d="M22 20h396" stroke="#6DDDD2" stroke-opacity=".18"/>

  <g font-family="Arial, sans-serif">
    <text x="29" y="43" fill="#8CE8DF" font-size="10" font-weight="700" letter-spacing="1.4">EXTENSION INDÉPENDANTE</text>
    <text x="29" y="61" fill="#B4C8D4" font-size="10" letter-spacing="1.1">POUR CARDMARKET</text>

    <text x="28" y="105" fill="#F5FAFC" font-family="Avenir Next, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-.65">Aperçu</text>
    <text x="28" y="139" fill="#F5FAFC" font-family="Avenir Next, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-.65">immédiat</text>
    <rect x="29" y="157" width="38" height="3" rx="1.5" fill="#2CD1C0"/>
    <text x="29" y="185" fill="#DAE6EC" font-size="15" font-weight="600">Prix mini selon</text>
    <text x="29" y="206" fill="#DAE6EC" font-size="15" font-weight="600">état et langue</text>
    <text x="29" y="244" fill="#92AABB" font-size="10.5">Dans vos listes Wants</text>
  </g>

  <g filter="url(#shadow)" transform="translate(242 92) rotate(-9 41.5 58.5)">
    <rect x="-4" y="-4" width="91" height="125" rx="9" fill="#F5FAFC"/>
    <image x="0" y="0" width="83" height="117" href="card-art/539278-ditto-vmax-shf-051.jpg" xlink:href="card-art/539278-ditto-vmax-shf-051.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#small-card-clip)"/>
  </g>
  <g filter="url(#shadow)" transform="translate(344 104) rotate(10 41.5 58.5)">
    <rect x="-4" y="-4" width="91" height="125" rx="9" fill="#F5FAFC"/>
    <image x="0" y="0" width="83" height="117" href="card-art/691920-glaceon-vstar-crz-gg40.jpg" xlink:href="card-art/691920-glaceon-vstar-crz-gg40.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#small-card-clip)"/>
  </g>
  <g filter="url(#shadow)" transform="translate(285 38)">
    <rect x="-5" y="-5" width="122" height="169" rx="11" fill="#F6FBFC"/>
    <image x="0" y="0" width="112" height="159" href="card-art/691930-darkrai-vstar-crz-gg50.jpg" xlink:href="card-art/691930-darkrai-vstar-crz-gg50.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#main-card-clip)"/>
  </g>

  <g transform="translate(29 256)">
    <circle cx="3" cy="0" r="3" fill="#2CD1C0"/>
    <text x="12" y="4" fill="#B5C9D6" font-family="Arial, sans-serif" font-size="9.5" letter-spacing=".2">APERÇUS COMPACTS · AVANT LE SHOPPING WIZARD</text>
  </g>
</svg>
