    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17324D"/><stop offset="1" stop-color="#10253C"/></linearGradient>
    <linearGradient id="thumb1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70D7D0"/><stop offset="1" stop-color="#245E74"/></linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3C97A"/><stop offset="1" stop-color="#C56F54"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="145%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#16304A" flood-opacity=".16"/></filter>
  </defs>
  <rect width="440" height="280" rx="20" fill="url(#canvas)"/>
  <circle cx="410" cy="38" r="67" fill="#2DD4BF" opacity=".13"/>
  <circle cx="38" cy="265" r="94" fill="#B7D9E1" opacity=".25"/>
