  <text x="29" y="164" fill="#53697C" font-family="Arial, sans-serif" font-size="14">Aperçu compact et prix mini.</text>
  <text x="29" y="184" fill="#53697C" font-family="Arial, sans-serif" font-size="14">État et langue pris en compte.</text>
