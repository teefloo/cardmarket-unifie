<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">Listes de cartes plus claires</title>
  <desc id="desc">Aperçu compact des cartes recherchées et de leur prix minimum.</desc>
  <defs>
