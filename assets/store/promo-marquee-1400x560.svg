<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu immédiat et prix mini selon état et langue</title>
  <desc id="desc">Extension indépendante pour Cardmarket. Les huit cartes montrées sont de vrais visuels produit; l’extension ajoute des aperçus dans les listes Wants et calcule un prix mini selon l’état et la langue.</desc>
  <defs>
    <linearGradient id="left-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102238"/>
      <stop offset="1" stop-color="#1A3D52"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2CD1C0" stop-opacity=".23"/>
      <stop offset="1" stop-color="#2CD1C0" stop-opacity="0"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17364B" flood-opacity=".10"/>
    </filter>
    <filter id="image-shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#163247" flood-opacity=".2"/>
    </filter>
    <clipPath id="card-clip" clipPathUnits="userSpaceOnUse"><rect width="104" height="147" rx="7"/></clipPath>
  </defs>
  <rect width="1400" height="560" fill="#EFF5F6"/>
  <rect width="470" height="560" fill="url(#left-panel)"/>
  <circle cx="436" cy="88" r="178" fill="url(#accent-light)"/>
  <circle cx="46" cy="534" r="160" fill="#2CD1C0" opacity=".045"/>
  <path d="M470 0v560" stroke="#2CD1C0" stroke-opacity=".75" stroke-width="2"/>
  <path d="M36 34h398" stroke="#92E7DF" stroke-opacity=".18"/>

  <g font-family="Arial, sans-serif">
    <text x="58" y="73" fill="#8CE8DF" font-size="12" font-weight="700" letter-spacing="1.45">EXTENSION INDÉPENDANTE</text>
    <text x="58" y="94" fill="#B6C9D4" font-size="11" letter-spacing="1.3">POUR CARDMARKET</text>

    <text x="57" y="175" fill="#F6FAFC" font-family="Avenir Next, Arial, sans-serif" font-size="53" font-weight="700" letter-spacing="-1.8">Aperçu</text>
    <text x="57" y="235" fill="#F6FAFC" font-family="Avenir Next, Arial, sans-serif" font-size="53" font-weight="700" letter-spacing="-1.8">immédiat</text>
    <rect x="60" y="260" width="50" height="4" rx="2" fill="#2CD1C0"/>

    <text x="60" y="313" fill="#E2ECF0" font-size="23" font-weight="700">Prix mini selon</text>
    <text x="60" y="344" fill="#E2ECF0" font-size="23" font-weight="700">état et langue</text>
    <text x="60" y="389" fill="#B7C9D4" font-size="16">Dans vos listes Wants,</text>
    <text x="60" y="413" fill="#B7C9D4" font-size="16">avant le Shopping Wizard.</text>

    <rect x="58" y="463" width="275" height="40" rx="20" fill="#2CD1C0"/>
    <circle cx="79" cy="483" r="4" fill="#12344A"/>
    <text x="94" y="488" fill="#11354A" font-size="12" font-weight="700" letter-spacing=".45">APERÇU COMPACT · PRIX MINI</text>
    <text x="60" y="531" fill="#8FAAB9" font-size="10.5">Visuels produit Cardmarket · sans prix fictifs</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="504" y="33" fill="#587181" font-size="10" font-weight="700" letter-spacing="1.25">CARTES PRÉSENTÉES</text>
    <path d="M504 42h864" stroke="#D6E2E6"/>
  </g>

  <g filter="url(#tile-shadow)">
    <rect x="503" y="57" width="198" height="220" rx="12" fill="#FFFFFF" stroke="#DDE8EB"/>
    <rect x="718" y="57" width="198" height="220" rx="12" fill="#FFFFFF" stroke="#DDE8EB"/>
    <rect x="933" y="57" width="198" height="220" rx="12" fill="#FFFFFF" stroke="#DDE8EB"/>
    <rect x="1148" y="57" width="198" height="220" rx="12" fill="#FFFFFF" stroke="#DDE8EB"/>
    <rect x="503" y="291" width="198" height="220" rx="12" fill="#FFFFFF" stroke="#DDE8EB"/>
    <rect x="718" y="291" width="198" height="220" rx="12" fill="#FFFFFF" stroke="#DDE8EB"/>
    <rect x="933" y="291" width="198" height="220" rx="12" fill="#FFFFFF" stroke="#DDE8EB"/>
    <rect x="1148" y="291" width="198" height="220" rx="12" fill="#FFFFFF" stroke="#DDE8EB"/>
  </g>

  <g filter="url(#image-shadow)">
