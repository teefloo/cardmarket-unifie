    <g transform="translate(765 67)"><rect x="-3" y="-3" width="110" height="153" rx="9" fill="#FFFFFF"/><image x="0" y="0" width="104" height="147" href="card-art/539278-ditto-vmax-shf-051.jpg" xlink:href="card-art/539278-ditto-vmax-shf-051.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#card-clip)"/></g>
    <g transform="translate(980 67)"><rect x="-3" y="-3" width="110" height="153" rx="9" fill="#FFFFFF"/><image x="0" y="0" width="104" height="147" href="card-art/665676-dragonite-vstar-pgo-050.jpg" xlink:href="card-art/665676-dragonite-vstar-pgo-050.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#card-clip)"/></g>
    <g transform="translate(1195 67)"><rect x="-3" y="-3" width="110" height="153" rx="9" fill="#FFFFFF"/><image x="0" y="0" width="104" height="147" href="card-art/691920-glaceon-vstar-crz-gg40.jpg" xlink:href="card-art/691920-glaceon-vstar-crz-gg40.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#card-clip)"/></g>
    <g transform="translate(550 301)"><rect x="-3" y="-3" width="110" height="153" rx="9" fill="#FFFFFF"/><image x="0" y="0" width="104" height="147" href="card-art/658751-darkrai-vstar-asr-099.jpg" xlink:href="card-art/658751-darkrai-vstar-asr-099.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#card-clip)"/></g>
    <g transform="translate(765 301)"><rect x="-3" y="-3" width="110" height="153" rx="9" fill="#FFFFFF"/><image x="0" y="0" width="104" height="147" href="card-art/692433-lucario-vstar-swsh-291.jpg" xlink:href="card-art/692433-lucario-vstar-swsh-291.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#card-clip)"/></g>
    <g transform="translate(980 301)"><rect x="-3" y="-3" width="110" height="153" rx="9" fill="#FFFFFF"/><image x="0" y="0" width="104" height="147" href="card-art/665267-mewtwo-vstar-pgo-031.jpg" xlink:href="card-art/665267-mewtwo-vstar-pgo-031.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#card-clip)"/></g>
    <g transform="translate(1195 301)"><rect x="-3" y="-3" width="110" height="153" rx="9" fill="#FFFFFF"/><image x="0" y="0" width="104" height="147" href="card-art/691901-ditto-crz-gg22.jpg" xlink:href="card-art/691901-ditto-crz-gg22.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#card-clip)"/></g>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="602" y="238" fill="#233D50" font-size="11.5" font-weight="700">Darkrai VSTAR</text>
    <text x="602" y="257" fill="#6A8190" font-size="9.5" letter-spacing=".55">CRZ · GG50</text>
    <text x="817" y="238" fill="#233D50" font-size="11.5" font-weight="700">Ditto VMAX</text>
    <text x="817" y="257" fill="#6A8190" font-size="9.5" letter-spacing=".55">SHF · 051</text>
    <text x="1032" y="238" fill="#233D50" font-size="11.5" font-weight="700">Dragonite VSTAR</text>
    <text x="1032" y="257" fill="#6A8190" font-size="9.5" letter-spacing=".55">PGO · 050</text>
    <text x="1247" y="238" fill="#233D50" font-size="11.5" font-weight="700">Glaceon VSTAR</text>
    <text x="1247" y="257" fill="#6A8190" font-size="9.5" letter-spacing=".55">CRZ · GG40</text>

    <text x="602" y="472" fill="#233D50" font-size="11.5" font-weight="700">Darkrai VSTAR</text>
    <text x="602" y="491" fill="#6A8190" font-size="9.5" letter-spacing=".55">ASR · 099</text>
    <text x="817" y="472" fill="#233D50" font-size="11.5" font-weight="700">Lucario VSTAR</text>
    <text x="817" y="491" fill="#6A8190" font-size="9.5" letter-spacing=".55">SWSH · 291</text>
    <text x="1032" y="472" fill="#233D50" font-size="11.5" font-weight="700">Mewtwo VSTAR</text>
    <text x="1032" y="491" fill="#6A8190" font-size="9.5" letter-spacing=".55">PGO · 031</text>
    <text x="1247" y="472" fill="#233D50" font-size="11.5" font-weight="700">Ditto</text>
    <text x="1247" y="491" fill="#6A8190" font-size="9.5" letter-spacing=".55">CRZ · GG22</text>
