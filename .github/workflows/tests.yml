name: Tests

on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lancer les tests
        run: node --test --test-reporter=tap tests/
